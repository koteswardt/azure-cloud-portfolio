<svg viewBox="0 0 1100 900" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#0078D4"/>
    </marker>
  </defs>

  <rect width="1100" height="900" fill="#FAFBFC"/>

  <text x="550" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#1E3A5F">OPS-CLOUD-009 — 3-Tier Web Application</text>
  <text x="550" y="62" text-anchor="middle" font-size="13" fill="#666666">Azure Cloud Journey — Phase 1 (Console) — rg-capstone-opscloud009 — Australia East</text>

  <!-- User -->
  <rect x="470" y="90" width="160" height="50" rx="6" fill="#FFFFFF" stroke="#666666" stroke-width="1.5"/>
  <text x="550" y="120" text-anchor="middle" font-size="13" font-weight="bold" fill="#333333">User (Browser)</text>

  <line x1="550" y1="140" x2="550" y2="175" stroke="#0078D4" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="565" y="162" font-size="11" fill="#0078D4">HTTPS</text>

  <!-- Frontend Tier -->
  <rect x="350" y="180" width="400" height="90" rx="8" fill="#E8F4FD" stroke="#0078D4" stroke-width="2"/>
  <text x="370" y="202" font-size="12" font-weight="bold" fill="#0078D4">TIER 1 — FRONTEND</text>
  <text x="370" y="225" font-size="13" font-weight="bold" fill="#1E3A5F">Blob Storage Static Website</text>
  <text x="370" y="244" font-size="11" fill="#333333">capstone009bstorage  ($web container)</text>
  <text x="370" y="260" font-size="11" fill="#333333">index.html · Standard LRS</text>

  <line x1="550" y1="270" x2="550" y2="305" stroke="#0078D4" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="565" y="292" font-size="11" fill="#0078D4">fetch() GET /api/products</text>

  <!-- Backend Tier -->
  <rect x="330" y="310" width="440" height="110" rx="8" fill="#E8F4FD" stroke="#0078D4" stroke-width="2"/>
  <text x="350" y="332" font-size="12" font-weight="bold" fill="#0078D4">TIER 2 — BACKEND</text>
  <text x="350" y="355" font-size="13" font-weight="bold" fill="#1E3A5F">App Service — app-capstone-009</text>
  <text x="350" y="374" font-size="11" fill="#333333">Node.js 22 LTS · Linux · Free F1</text>
  <text x="350" y="392" font-size="11" fill="#333333">GET /api/health · GET /api/products</text>
  <text x="350" y="410" font-size="11" font-weight="bold" fill="#107C10">System-Assigned Managed Identity: ON</text>

  <line x1="450" y1="420" x2="450" y2="455" stroke="#107C10" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="465" y="442" font-size="11" fill="#107C10">Managed Identity auth</text>

  <line x1="650" y1="420" x2="650" y2="455" stroke="#0078D4" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="665" y="442" font-size="11" fill="#0078D4">db_datareader query</text>

  <!-- Key Vault -->
  <rect x="300" y="460" width="260" height="90" rx="8" fill="#FFF4E5" stroke="#D17B00" stroke-width="2"/>
  <text x="320" y="482" font-size="12" font-weight="bold" fill="#D17B00">SECRETS</text>
  <text x="320" y="505" font-size="13" font-weight="bold" fill="#1E3A5F">Key Vault — kv-capstone-009</text>
  <text x="320" y="524" font-size="11" fill="#333333">Secret: SqlConnectionString</text>
  <text x="320" y="540" font-size="11" fill="#333333">RBAC: App = Secrets User</text>

  <!-- SQL Database -->
  <rect x="580" y="460" width="260" height="90" rx="8" fill="#E8F4FD" stroke="#0078D4" stroke-width="2"/>
  <text x="600" y="482" font-size="12" font-weight="bold" fill="#0078D4">TIER 3 — DATABASE</text>
  <text x="600" y="505" font-size="13" font-weight="bold" fill="#1E3A5F">Azure SQL — capstonedb</text>
  <text x="600" y="524" font-size="11" fill="#333333">Server: capstone-sql-009</text>
  <text x="600" y="540" font-size="11" fill="#333333">Table: Products (4 rows) · Basic tier</text>

  <!-- Monitoring -->
  <rect x="120" y="600" width="860" height="160" rx="8" fill="#F3E8FD" stroke="#7B2FBE" stroke-width="2"/>
  <text x="140" y="624" font-size="12" font-weight="bold" fill="#7B2FBE">MONITORING</text>

  <rect x="140" y="635" width="260" height="100" rx="6" fill="#FFFFFF" stroke="#7B2FBE" stroke-width="1.5"/>
  <text x="155" y="658" font-size="12" font-weight="bold" fill="#1E3A5F">Log Analytics Workspace</text>
  <text x="155" y="676" font-size="11" fill="#333333">law-capstone-009</text>
  <text x="155" y="693" font-size="11" fill="#333333">HTTP logs, console logs,</text>
  <text x="155" y="708" font-size="11" fill="#333333">app logs, AllMetrics</text>

  <rect x="430" y="635" width="260" height="100" rx="6" fill="#FFFFFF" stroke="#7B2FBE" stroke-width="1.5"/>
  <text x="445" y="658" font-size="12" font-weight="bold" fill="#1E3A5F">Alert Rule</text>
  <text x="445" y="676" font-size="11" fill="#333333">alert-http5xx-capstone-009</text>
  <text x="445" y="693" font-size="11" fill="#333333">Http5xx &gt; 5 in 5 min</text>
  <text x="445" y="708" font-size="11" fill="#333333">Severity 1 - Error · $0.10/mo</text>

  <rect x="720" y="635" width="240" height="100" rx="6" fill="#FFFFFF" stroke="#7B2FBE" stroke-width="1.5"/>
  <text x="735" y="658" font-size="12" font-weight="bold" fill="#1E3A5F">Action Group</text>
  <text x="735" y="676" font-size="11" fill="#333333">ag-capstone-009</text>
  <text x="735" y="693" font-size="11" fill="#333333">Email + Azure mobile app</text>
  <text x="735" y="708" font-size="11" fill="#333333">notification</text>

  <line x1="650" y1="420" x2="270" y2="635" stroke="#7B2FBE" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <line x1="400" y1="685" x2="430" y2="685" stroke="#7B2FBE" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="690" y1="685" x2="720" y2="685" stroke="#7B2FBE" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <text x="120" y="800" font-size="11" fill="#666666">Resource Group: rg-capstone-opscloud009  ·  Region: Australia East  ·  Cost: ~$5.50 USD/month (~$0.11 after SQL cleanup)</text>
  <text x="120" y="820" font-size="11" fill="#666666">Solid blue = data/request flow   ·   Green = Managed Identity auth   ·   Purple dashed = diagnostic log flow</text>
</svg>
